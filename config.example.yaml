# ──────────────────────────────────────────────────────────────────────────────
# TPT Backtesting Engine — example configuration (multi-symbol format)
#
# Copy this file to config.yaml and adjust as needed.
# All fields are optional; defaults are shown here.
#
# Run the multi-symbol engine:
#   python -m backtest_engine.run_multi --config config.yaml
#
# Run the legacy two-symbol engine (backward compatible):
#   python -m backtest_engine.run --config config.yaml
# ──────────────────────────────────────────────────────────────────────────────

# ── Account-level TPT evaluation rules ───────────────────────────────────────
account:
  size: 150000

  # Monthly profit target: $9,000 combined across all symbols.
  # ⚠️  MISSING the target is NOT a failure — it means you pay another monthly
  # recurring fee and continue.  The account is ONLY failed by the $4,500
  # intraday trailing drawdown breach.
  profit_target: 9000
  monthly_target_window_days: 20   # informational: ~20 trading days per month

  # THE ONLY HARD FAIL: intraday trailing drawdown.
  # Measured tick-by-tick in real time, INCLUDING open floating (unrealized)
  # losses.  The floor trails the highest achieved equity and never moves down.
  # If combined floating equity ever drops $4,500 below the running peak —
  # even for a single tick — the account FAILS.
  trailing_drawdown: 4500
  dd_mode: intraday              # confirmed TPT rule: tick-by-tick incl. open floating
  dd_source: adverse_excursion   # use AE column as per-trade intraday-loss estimate

  # Concurrency: stack AE from simultaneously-open trades only.
  concurrency: overlap_timestamps

  # Safety buffer: recommend sizes whose est. worst-case combined floating DD
  # stays under this value (default $3,000, giving $1,500 margin below $4,500).
  safety_buffer: 3000

  # Maximum concurrent micro contracts across ALL symbols simultaneously.
  max_micros: 150

  # Minimum trading days required (evaluated per calendar month).
  min_trading_days: 5

  # Best single day must be < 50% of net P/L.  If not, the effective profit
  # goal is raised to net_pl × 2.  This is NOT a failure — just a higher bar.
  consistency_pct: 0.50

  session_tz: America/New_York
  weekend_filter_mode: drop    # "drop" or "flatten"


# ── Per-symbol configuration ──────────────────────────────────────────────────
# Each symbol's CSV path, target contract size, and CME micro-futures specs.
#
# Baked-in CME micro-futures specs (point_value, tick_size, tick_value):
#   MGC  Micro Gold            $10/pt   $0.10 tick  $1.00/tick
#   M2K  Micro Russell 2000    $5/pt    $0.10 tick  $0.50/tick
#   MNQ  Micro Nasdaq-100      $2/pt    $0.25 tick  $0.50/tick
#   MYM  Micro Dow             $0.50/pt $1.00 tick  $0.50/tick
#   MCL  Micro Crude Oil       $10/pt   $0.01 tick  $0.10/tick
#
# Missing CSV → warning + skip; no code change needed to add a new symbol.
# Default M2K1.csv is the 5-lot file (1+4 scale-in); baseline auto-detected.
symbols:
  MGC:
    csv: data/MGC1.csv
    contract_size: 1          # 1 contract (native baseline)
    point_value: 10.0
    tick_size: 0.10

  M2K:
    csv: data/M2K1.csv
    contract_size: 5          # 5-lot scale-in (1+4); baseline auto-detected
    point_value: 5.0
    tick_size: 0.10

  MNQ:
    csv: data/MNQ1.csv
    contract_size: 1          # 1 contract (native baseline)
    point_value: 2.0
    tick_size: 0.25

  MYM:
    csv: data/MYM1.csv
    contract_size: 1
    point_value: 0.50
    tick_size: 1.0

  MCL:
    csv: data/MCL1.csv
    contract_size: 1
    point_value: 10.0
    tick_size: 0.01


# ── Output ────────────────────────────────────────────────────────────────────
output_dir: "reports"
data_timezone: "US/Eastern"

# Set to true to generate equity + drawdown charts (saved as PNG to output_dir).
generate_charts: false


# ──────────────────────────────────────────────────────────────────────────────
# IMPORTANT LIMITATION
# ──────────────────────────────────────────────────────────────────────────────
# We do NOT have 1-minute or tick OHLC data.  The trade logs are
# close-to-close, with an Adverse Excursion USD column giving each trade's
# worst intra-trade floating loss (but NOT its timestamp).
#
# Therefore: a true tick-by-tick trailing-drawdown breach CANNOT be
# definitively confirmed from this data.  The engine computes a conservative
# concurrency-based ESTIMATE.  Every drawdown verdict is labelled:
#
#   "ESTIMATE ONLY — intraday tick-by-tick breach cannot be confirmed
#    without 1-minute/tick OHLC.  Size defensively."
#
# To get a definitive intraday drawdown validation, source 1-minute or tick
# OHLC data for each symbol and integrate it with the trade log.
# ──────────────────────────────────────────────────────────────────────────────

